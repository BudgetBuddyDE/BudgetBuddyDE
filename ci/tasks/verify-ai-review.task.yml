platform: linux
image_resource:
  type: registry-image
  source:
    repository: ghcr.io/astral-sh/uv
    tag: 0.13.1-python3.12-bookworm
inputs:
  - name: repository
run:
  path: sh
  args:
    - -ec
    - |
      cd repository/tools/ai-review
      uv sync --locked
      uv run --locked ruff check .
      uv run --locked ruff format --check .
      uv run --locked pytest
