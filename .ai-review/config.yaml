version: 1
review:
  language: de
  instructions: instructions.md
  customPrompt: custom-prompt.md
criteria:
  - id: correctness
    instructions: criteria/correctness.md
    paths: ['**']
    blockingFrom: high
  - id: security
    instructions: criteria/security.md
    paths: ['services/backend/**', 'packages/api/**', 'packages/db/**']
    blockingFrom: high
gate:
  onIncomplete: block
  onProviderError: block
  onInvalidResult: block
limits:
  timeout: 10m
  maxModelCalls: 20
publishing:
  maxInlineComments: 15
  suggestions: true
  updateSummary: true
