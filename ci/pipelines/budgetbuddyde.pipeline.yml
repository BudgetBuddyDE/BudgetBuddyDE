meta:
  gh-status-handlers: &gh-status-handlers
    on_success:
      put: github-status
      inputs: [repository]
      params: {state: success}
    on_failure:
      do:
        - put: github-status
          inputs: [repository]
          params: {state: failure}
        - put: notification
          params:
            alert_type: failed
            message: 'Release failed in pipeline budgetbuddyde'
            role: '1342563020215291936'
    on_error:
      do:
        - put: github-status
          inputs: [repository]
          params: {state: error}
        - put: notification
          params:
            alert_type: failed
            message: 'Release errored in pipeline budgetbuddyde'
            role: '1342563020215291936'
    on_abort:
      put: github-status
      inputs: [repository]
      params: {state: abort}

  pr-status-handlers: &pr-status-handlers
    on_success:
      put: github-pr
      inputs: [pull-request]
      params:
        path: pull-request
        status: success
        base_context: concourse
        context: validate
    on_failure:
      put: github-pr
      inputs: [pull-request]
      params:
        path: pull-request
        status: failure
        base_context: concourse
        context: validate
    on_error:
      put: github-pr
      inputs: [pull-request]
      params:
        path: pull-request
        status: error
        base_context: concourse
        context: validate
    on_abort:
      put: github-pr
      inputs: [pull-request]
      params:
        path: pull-request
        status: error
        base_context: concourse
        context: validate

  release-task: &release-task
    task: release
    file: repository/ci/tasks/release-unit.yml
    image: node-image

jobs:
  - name: pull-request-check
    public: true
    <<: *pr-status-handlers
    plan:
      - in_parallel:
          - get: node-image
          - get: pull-request
            resource: github-pr
            trigger: true
            version: every
      - put: github-pr
        inputs: [pull-request]
        get_params: {skip_download: true}
        params:
          path: pull-request
          status: pending
          base_context: concourse
          context: validate
      - task: check
        image: node-image
        config:
          platform: linux
          inputs:
            - name: pull-request
          params:
            CI: 'true'
            FORCE_COLOR: 1
            TURBO_TELEMETRY_DISABLED: 1
            NEXT_TELEMETRY_DISABLED: 1
          run:
            path: sh
            args:
              - -exc
              - |
                cd pull-request
                npm ci
                npm run ci

  - name: release-webapp-patch
    public: true
    serial_groups: [release-webapp]
    <<: *gh-status-handlers
    plan:
      - in_parallel:
          - get: node-image
          - get: repository
            resource: repo-webapp
            trigger: true
          - get: version
            resource: version-webapp
            params: {bump: patch}
      - put: github-status
        inputs: [repository]
        params: {state: pending}
      - <<: *release-task
        params:
          UNIT_NAME: webapp
          UNIT_PATH: apps/webapp
          NPM_PACKAGE: '@budgetbuddyde/webapp'
          UNIT_TYPE: app
      - put: repo-webapp
        inputs: [repository, release-meta]
        params:
          repository: repository
          only_tag: true
          tag: release-meta/tag
          annotate: release-meta/annotate
      - put: version-webapp
        params: {file: version/version}

