name: PR Agent Review

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]

permissions: {}

concurrency:
  group: pr-agent-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.sender.type != 'Bot' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Create repository-scoped GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.PR_AGENT_APP_CLIENT_ID }}
          private-key: ${{ secrets.PR_AGENT_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-issues: write
          permission-pull-requests: write

      - name: Review pull request with PR-Agent
        uses: docker://pragent/pr-agent@sha256:80edef71baa3df28c129d858d4b53784abfc14704c235efb32b6c461d5399a6d
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          OPENAI_KEY: ${{ secrets.LITELLM_API_KEY }}
          OPENAI__API_BASE: ${{ vars.LITELLM_API_BASE }}
          CONFIG__MODEL: ${{ vars.LITELLM_MODEL }}
          CONFIG__MODEL_WEAK: ${{ vars.LITELLM_MODEL }}
          CONFIG__FALLBACK_MODELS: '[]'
          CONFIG__CUSTOM_MODEL_MAX_TOKENS: ${{ vars.LITELLM_CONTEXT_TOKENS }}
          CONFIG__MAX_MODEL_TOKENS: ${{ vars.LITELLM_CONTEXT_TOKENS }}
          CONFIG__USE_REPO_SETTINGS_FILE: 'false'
          CONFIG__USE_GLOBAL_SETTINGS_FILE: 'false'
          CONFIG__RESTRICTED_MODE: 'true'
          PR_REVIEWER.PERSISTENT_COMMENT: 'false'
          PR_REVIEWER.PERSISTENT_FINDING_STATE: 'false'
          GITHUB_ACTION_CONFIG.AUTO_REVIEW: 'true'
          GITHUB_ACTION_CONFIG.AUTO_DESCRIBE: 'false'
          GITHUB_ACTION_CONFIG.AUTO_IMPROVE: 'false'
          GITHUB_ACTION_CONFIG.PR_ACTIONS: '["opened", "reopened", "ready_for_review"]'
          GITHUB_ACTION_CONFIG.HANDLE_PUSH_TRIGGER: 'true'
          GITHUB_ACTION_CONFIG.PUSH_COMMANDS: '["/review"]'
