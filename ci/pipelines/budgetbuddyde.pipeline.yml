groups:
  - name: all
    jobs:
      - '*'
  - name: pull-requests
    jobs:
      - pull-request-check
  - name: releases
    jobs:
      - 'release-*'
  - name: packages
    jobs:
      - 'release-api-*'
      - 'release-core-*'
      - 'release-db-*'
      - 'release-logger-*'
  - name: apps
    jobs:
      - 'release-webapp-*'
  - name: services
    jobs:
      - 'release-auth-service-*'
      - 'release-backend-*'
      - 'release-mcp-*'
  - name: database
    jobs:
      - 'database-*'
      - 'update-*-database'

resource_types:
  - name: discord-alert
    type: registry-image
    source:
      repository: ghcr.io/tklein1801/concourse-discord-alert-resource

  - name: cogito
    type: registry-image
    check_every: 24h
    source:
      repository: pix4d/cogito

  - name: pull-request
    type: registry-image
    check_every: 24h
    source:
      repository: teliaoss/github-pr-resource

resources:
  - name: node-image
    type: registry-image
    icon: nodejs
    source:
      repository: node
      tag: lts

  - name: github-pr
    type: pull-request
    icon: source-pull
    check_every: 1m
    source:
      repository: ((repo_owner))/((repo_name))
      access_token: ((github.pat))
      base_branch: main

  - name: github-status
    type: cogito
    icon: github
    check_every: never
    source:
      owner: ((repo_owner))
      repo: ((repo_name))
      access_token: ((github.pat))
      context_prefix: concourse

  - name: notification
    type: discord-alert
    icon: bell-ring
    source:
      url: ((discord.webhook_url))

  - name: repo-webapp
    type: git
    icon: git
    source:
      uri: git@github.com:((repo_owner))/((repo_name)).git
      private_key: ((github.private_key))
      branch: main
      paths:
        - apps/webapp/**
        - packages/api/**
        - packages/core/**
        - packages/logger/**
        - package.json
        - package-lock.json
        - turbo.json
        - tsconfig.json

  - name: repo-mcp
