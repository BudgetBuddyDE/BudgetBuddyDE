platform: linux

image_resource:
  type: registry-image
  source:
    repository: ghcr.io/voidzero-dev/vite-plus
    tag: '1.3.0'
  version:
    digest: sha256:61860c1b58bf35878605280802809973c668f1594675298c3be553a98ac06e59

inputs:
  - name: repository

params:
  CI: 'true'
  FORCE_COLOR: 1
  DATABASE_URL: ''
  NPM_CONFIG_LOGLEVEL: 'error'
  NPM_CONFIG_FUND: false
  NPM_CONFIG_AUDIT: false
  NPM_CONFIG_UPDATE_NOTIFIER: false

run:
  # Preserve the previous Node image's user for writable inputs on older Concourse workers.
  user: root
  path: sh
  args:
    - -ec
    - |
      cd repository
      : "${DATABASE_URL:?DATABASE_URL has not been set}"
      vp --version
      node --version
      npm --version
      test "$(node --version)" = "v$(cat .node-version)"
      test "$(npm --version)" = "$(node -p "require('./package.json').packageManager.replace(/^npm@/, '')")"
      npm ci
      npm run build -- --filter=@budgetbuddyde/db

      cd packages/db
      npx --no-install drizzle-kit check
      npm run db:migrate
