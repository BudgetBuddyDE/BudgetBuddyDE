platform: linux

image_resource:
  type: registry-image
  source:
    repository: node
    tag: 24.21.0

inputs:
  - name: repository

params:
  CI: 'true'
  FORCE_COLOR: 1
  DATABASE_URL: ''
  NPM_CONFIG_LOGLEVEL: 'error'
  NPM_CONFIG_FUND: false
  NPM_CONFIG_AUDIT: false
  NPM_CONFIG_UPDATE_NOTIFIER: false

run:
  path: sh
  args:
    - -ec
    - |
      cd repository/packages/db/
      : "${DATABASE_URL:?DATABASE_URL has not been set}"
      npm ci
      npx --no-install drizzle-kit check
      npm run db:migrate
