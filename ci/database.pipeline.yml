groups:
  - name: all
    jobs:
      - '*'
  - name: backups
    jobs:
      - '*backup*'
  - name: database
    jobs:
      - update-*-database

resources:
  - name: ci-source
    type: git
    icon: git
    source:
      uri: git@github.com:((ci.source.owner))/((ci.source.name)).git
      branch: ((ci.source.branch))
      private_key: ((github.private_key))
      disable_ci_skip: false
  - name: node-image
    type: registry-image
    icon: nodejs
    source:
      repository: node
      tag: 24.21.0
  - name: repository
    type: git
    icon: git
    source:
      uri: git@github.com:((repo.owner))/((repo.name)).git
      private_key: ((github.private_key))
      branch: main
      paths: [packages/db/**]
  - name: db-bucket
    type: s3
    icon: database-import
    source:
      bucket: ((s3-db-backup.bucket))
      region_name: ((s3-db-backup.region))
      access_key_id: ((s3-db-backup.access_key_id))
      secret_access_key: ((s3-db-backup.access_key_secret))
      regexp: backup_(.*).dump
  - name: daily-timer
    type: time
    icon: clock
    source:
      interval: 24h

jobs:
  - name: database-backup
    public: false
    plan:
      - get: daily-timer
        trigger: true
      - task: dump-database
        config:
          platform: linux
          image_resource:
            type: registry-image
            source:
              repository: postgres
              tag: '17'
          outputs:
            - name: backup
          params:
            CI: 'true'
            FORCE_COLOR: 1
            DATABASE_URL: ((database.prod-database-url))
          run:
            path: sh
            args:
              - -ec
              - |
                TIMESTAMP=$(date +%Y-%m-%d_%H-%M-%S)
                FILE="backup_${TIMESTAMP}.dump"
                echo "Creating PostgreSQL dump..."
                pg_dump "$DATABASE_URL" -Fc -f "backup/$FILE" >> /dev/null
                echo "Backup created!"
      - put: db-bucket
        params:
          file: backup/*.dump
  - name: update-test-database
    public: false
    plan:
      - in_parallel:
          - get: ci-source
          - get: node-image
          - get: repository
            resource: repository
            trigger: true
      - task: apply-migrations
        file: ci-source/ci/tasks/apply-db-migration.task.yml
        image: node-image
        params:
          REPO_PATH: packages/db/drizzle
          DATABASE_URL: ((database.test-database-url))
  - name: update-prod-database
    public: false
    plan:
      - in_parallel:
          - get: ci-source
          - get: node-image
          - get: repository
            resource: repository
            passed: [update-test-database]
      - task: apply-migrations
        file: ci-source/ci/tasks/apply-db-migration.task.yml
        image: node-image
        params:
          REPO_PATH: packages/db/drizzle
          DATABASE_URL: ((database.prod-database-url))
