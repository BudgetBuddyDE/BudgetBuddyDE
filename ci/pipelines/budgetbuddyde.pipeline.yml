  - name: database-backup
    public: false
    plan:
      - get: daily-timer
        trigger: true
      - task: dump-database
        config:
          platform: linux
          image_resource:
            type: registry-image
            source:
              repository: postgres
              tag: 17
          outputs:
            - name: backup
          params:
            CI: 'true'
            FORCE_COLOR: 1
            DATABASE_URL: ((manage-database.prod-database-url))
          run:
            path: sh
            args:
              - -ec
              - |
                TIMESTAMP=$(date +%Y-%m-%d_%H-%M-%S)
                FILE="backup_${TIMESTAMP}.dump"
                echo "Creating PostgreSQL dump..."
                pg_dump "$DATABASE_URL" -Fc -f "backup/$FILE" >> /dev/null
                echo "Backup created!"
      - put: db-bucket
        params:
          file: backup/*.dump

  - name: update-test-database
    public: false
    plan:
      - in_parallel:
          - get: node-image
          - get: repository
            resource: repository-database
            trigger: true
      - task: apply-migrations
        image: node-image
        config:
          platform: linux
          inputs:
            - name: repository
          params:
            CI: 'true'
            FORCE_COLOR: 1
            TURBO_TELEMETRY_DISABLED: 1
            DATABASE_URL: ((manage-database.test-database-url))
          run:
            path: sh
            args:
              - -exc
              - |
                cd repository
                npm ci
                npx turbo run build --filter=@budgetbuddyde/db
                cd packages/db
                npx drizzle-kit check
                npm run db:migrate

  - name: update-prod-database
    public: false
    plan:
      - in_parallel:
          - get: node-image
          - get: repository
            resource: repository-database
            passed: [update-test-database]
      - task: apply-migrations
        image: node-image
        config:
          platform: linux
          inputs:
            - name: repository
          params:
            CI: 'true'
            FORCE_COLOR: 1
            TURBO_TELEMETRY_DISABLED: 1
            DATABASE_URL: ((manage-database.prod-database-url))
          run:
            path: sh
            args:
              - -exc
              - |
                cd repository
                npm ci
                npx turbo run build --filter=@budgetbuddyde/db
                cd packages/db
                npx drizzle-kit check
                npm run db:migrate
