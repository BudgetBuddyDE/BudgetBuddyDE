groups:
  - name: all
    jobs:
      - '*'
  - name: backups
    jobs:
      - '*backup*'
  - name: database
    jobs:
      - update-*-database

resources:
  - name: node-image
    type: registry-image
    icon: nodejs
    source:
      repository: node
      tag: 24.21.0
  - name: repository
    type: git
    icon: git
    source:
      uri: git@github.com:((repo_owner))/((repo_name)).git
      private_key: ((github.private_key))
      branch: main
      paths: [((repo_path))/drizzle/**]
  - name: db-bucket
    type: s3
    icon: database-import
    source:
      bucket: ((s3-db-backup.bucket))
      region_name: ((s3-db-backup.region))
      access_key_id: ((s3-db-backup.access_key_id))
      secret_access_key: ((s3-db-backup.access_key_secret))
      regexp: backup_(.*).dump
  - name: daily-timer
    type: time
    icon: clock
    source:
      interval: 24h

jobs:
  - name: database-backup
    public: false
    plan:
      - get: daily-timer
        trigger: true
      - get: repository
      - task: dump-database
        file: repository/ci/tasks/db-backup.task.yml
        params:
          DATABASE_URL: ((manage-database.prod-database-url))
      - put: db-bucket
        params:
          file: backup/*.dump
  - name: update-test-database
    public: false
    plan:
      - in_parallel:
          - get: node-image
          - get: repository
            resource: repository
            trigger: true
      - task: apply-migrations
        file: repository/ci/tasks/apply-db-migration.task.yml
        image: node-image
        params:
          REPO_PATH: ((repo_path))
          DATABASE_URL: ((database.test-database-url))
  - name: update-prod-database
    public: false
    plan:
      - in_parallel:
          - get: node-image
          - get: repository
            resource: repository
            passed: [update-test-database]
      - task: apply-migrations
        file: repository/ci/tasks/apply-db-migration.task.yml
        image: node-image
        params:
          REPO_PATH: ((repo_path))
          DATABASE_URL: ((database.prod-database-url))
