[project]
name = "budgetbuddy-ai-review"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pr-agent @ git+https://github.com/The-PR-Agent/pr-agent.git@95a3cd0dacfbab14803eacc7cdac68c82d8d0af9",
  "boto3>=1.35,<2",
  "PyJWT[crypto]>=2.10,<3",
  "httpx>=0.28,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ai_review"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.hatch.metadata]
allow-direct-references = true
