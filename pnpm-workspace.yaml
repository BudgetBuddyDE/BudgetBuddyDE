packages:
  - 'packages/*'
  - 'services/*'
  - 'apps/webapp'
  - 'apps/documentation'
  - 'examples/*'

catalog:
  react: ^19.3.1
  react-dom: ^19.3.1

runtimeOnFail: ignore
pmOnFail: ignore

overrides:
  react: 'catalog:'
  react-dom: 'catalog:'
  'waku': '1.0.0-rc.1'
  'fumapress@* > waku': '1.0.0-rc.1'
  'vite@*': 'npm:@voidzero-dev/vite-plus-core@1.3.0'
  'vitest@*': '5.0.5'

allowBuilds:
  esbuild: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
