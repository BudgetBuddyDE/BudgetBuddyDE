groups:
  - name: all
    jobs:
      - '*'
  - name: validation
    jobs:
      - validate-build
      - pull-request
      - pull-request-ai-review
  - name: maintenance
    jobs:
      - update-dependencies

resource_types:
  - name: cogito
    type: registry-image
    check_every: 24h
    source:
      repository: pix4d/cogito
  - name: github-pr
    type: registry-image
    check_every: 24h
    source:
      repository: cfcommunity/github-pr-resource
      tag: '0.26.0'

resources:
  - name: ai-review-timer
    type: time
    source:
      interval: 5m
  - name: dependency-timer
    type: time
    icon: clock-outline
    source:
      interval: 168h
  - name: node-image
    type: registry-image
    icon: nodejs
    source:
      repository: node
      tag: 24.21.0
  - name: repository
    type: git
    icon: git
    source:
      uri: git@github.com:((repo.owner))/((repo.name)).git
      branch: main
      private_key: ((github.private_key))
      disable_ci_skip: false
  # Keep Git writes separate; dependency commits are detected by the main resource.
  - name: repository-write
    type: git
    icon: git
    source:
      uri: git@github.com:((repo.owner))/((repo.name)).git
      branch: main
      private_key: ((github.private_key))
      disable_ci_skip: true
  - name: pr-((repo.pr.branch))
    type: github-pr
    check_every: 1m
    icon: github
    source:
      repository: ((repo.owner))/((repo.name))
      access_token: ((github.pat))
      base_branch: ((repo.pr.branch))
      disable_ci_skip: true
  - name: status
    type: cogito
    icon: github
    check_every: never
    source:
      owner: ((repo.owner))
      repo: ((repo.name))
      access_token: ((github.pat))

jobs:
  # Never load review executables or task definitions from a PR checkout.
  - name: pull-request-ai-review
    public: false
    serial: true
    plan:
      - in_parallel:
          - get: ai-review-timer
            trigger: true
          - get: repository
      - task: build-ai-review-image
        privileged: true
        config:
          platform: linux
          image_resource:
            type: registry-image
            source:
              repository: concourse/oci-build-task
          inputs:
            - name: repository
          outputs:
            - name: image
          caches:
            - path: cache
          params:
            CONTEXT: repository/tools/ai-review
            UNPACK_ROOTFS: 'true'
          run:
            path: build
      - task: review-open-pull-requests
        image: image
        timeout: 2h
        config:
          platform: linux
          params:
            REVIEW_REPOSITORY: ((repo.owner))/((repo.name))
            REVIEW_BASE_BRANCH: ((repo.pr.branch))
            GITHUB_APP_ID: ((ai-review.appId))
            GITHUB_INSTALLATION_ID: ((ai-review.installationId))
            GITHUB_APP_PRIVATE_KEY: ((ai-review.appPrivateKey))
            LITELLM_BASE_URL: ((litellm.host))
            LITELLM_API_KEY: ((litellm.apiKey))
            LITELLM_MODEL: code-review
            REVIEW_S3_BUCKET: ((s3-ai-review.bucket))
            AWS_REGION: ((s3-ai-review.region))
            AWS_ACCESS_KEY_ID: ((s3-ai-review.access_key_id))
            AWS_SECRET_ACCESS_KEY: ((s3-ai-review.access_key_secret))
          run:
            path: /ai-review
            args: [reconcile]
  - name: update-dependencies
    public: false
    serial: true
    plan:
      - in_parallel:
          - get: dependency-timer
            trigger: true
          - get: repository
            resource: repository-write
      - task: update-dependencies
        file: repository/ci/tasks/update-dependencies.task.yml
        params:
          GIT_NAME: ((git.name))
          GIT_EMAIL: ((git.email))
      - put: repository-write
        inputs: [repository]
        no_get: true
        params:
          repository: repository
  - name: validate-build
    public: true
    on_success:
      put: status
      inputs: [repository]
      no_get: true
      params: {state: success}
    on_failure:
      put: status
      inputs: [repository]
      no_get: true
      params: {state: failure}
    on_error:
      put: status
      inputs: [repository]
      no_get: true
      params: {state: error}
    on_abort:
      put: status
      inputs: [repository]
      no_get: true
      params: {state: abort}
    plan:
      - in_parallel:
          - get: node-image
          - get: repository
            trigger: true
            version: every
      - put: status
        inputs: [repository]
        params: {state: pending}
        no_get: true
      - task: verify
        file: repository/ci/tasks/verify.task.yml
        image: node-image
      - task: verify-ai-review
        file: repository/ci/tasks/verify-ai-review.task.yml
  - name: pull-request
    public: true
    on_success:
      put: pr-((repo.pr.branch))
      params:
        path: pr-((repo.pr.branch))
        status: success
    on_failure:
      put: pr-((repo.pr.branch))
      params:
        path: pr-((repo.pr.branch))
        status: failure
    on_error:
      put: pr-((repo.pr.branch))
      params:
        path: pr-((repo.pr.branch))
        status: error
    on_abort:
      put: pr-((repo.pr.branch))
      params:
        path: pr-((repo.pr.branch))
        status: error
    plan:
      - in_parallel:
          - get: node-image
          - get: pr-((repo.pr.branch))
            trigger: true
            version: every
      - put: pr-((repo.pr.branch))
        params:
          path: pr-((repo.pr.branch))
          status: pending
      - task: verify
        file: pr-((repo.pr.branch))/ci/tasks/verify.task.yml
        image: node-image
        input_mapping:
          repository: pr-((repo.pr.branch))
      - task: verify-ai-review
        file: pr-((repo.pr.branch))/ci/tasks/verify-ai-review.task.yml
        input_mapping:
          repository: pr-((repo.pr.branch))
